name: DotNet Build
on: [push, workflow_dispatch, pull_request]

jobs:
  build:
    name: Build Release
    runs-on: windows-latest
    env:
      WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
      IS_BETA: ${{ github.ref == 'refs/tags/beta' }}
      IS_STABLE: ${{ startsWith(github.ref, 'refs/tags/MissionPlannerCX-') }}
      FILE_BASENAME: ${{ startsWith(github.ref, 'refs/tags/MissionPlannerCX-') && github.ref_name || 'MissionPlannerCX-beta' }}

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 10

      - name: Build
        shell: pwsh
        run: |
          $msbuildPath = Split-Path (& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\Current\Bin\amd64\MSBuild.exe | Select-Object -First 1) -Parent
          $env:PATH = $msbuildPath + ';' + $env:PATH
          nuget locals all -clear
          msbuild -v:m -restore -t:Build -p:Configuration=Release MissionPlanner.sln

      - name: Cleanup
        shell: pwsh
        run: |
          cd bin\Release\net461
          gci plugins | ForEach-Object {                 if (Test-Path $_.Name -PathType Leaf)                {                    Write-Host "Remove" $_.FullName   ;                 Remove-Item $_.FullName                            } else {                    Write-Host $_.Name                }            }

          copy version.txt ..\..\..\
          7z a -tzip ..\..\..\${{ env.FILE_BASENAME }}.zip *
          cd ..
          .\md5sum.exe net461 > ..\..\checksums.txt

      - name: Create MSI
        if: ${{ env.IS_STABLE == 'true' || env.IS_BETA == 'true' }}
        shell: pwsh
        run: |
          cd Msi
          if (Test-Path installer.wxs) { Remove-Item installer.wxs }
          & ".\net472\wix.exe" "..\bin\Release\net461"
          & "$env:WIX\bin\candle.exe" installer.wxs -ext WiXNetFxExtension -ext WixDifxAppExtension -ext WixUIExtension.dll -ext WixUtilExtension -ext WixIisExtension
          & "$env:WIX\bin\light.exe" installer.wixobj "$env:WIX\bin\difxapp_x86.wixlib" -sval -o ${{ env.FILE_BASENAME }}.msi -ext WiXNetFxExtension -ext WixDifxAppExtension -ext WixUIExtension.dll -ext WixUtilExtension -ext WixIisExtension
          Move-Item ${{ env.FILE_BASENAME }}.msi ..\${{ env.FILE_BASENAME }}.msi

      - uses: actions/upload-artifact@v4
        with:
          name: MissionPlannerBeta
          path: bin\Release\net461

      - uses: actions/upload-artifact@v4
        if: ${{ env.IS_STABLE == 'true' || env.IS_BETA == 'true' }}
        with:
          name: MSI
          path: ${{ env.FILE_BASENAME }}.msi

      - uses: "marvinpinto/action-automatic-releases@v1.2.1"
        if: ${{ env.IS_BETA == 'true' }}
        with:
          repo_token: "${{ secrets.GITHUB_TOKEN }}"
          automatic_release_tag: "betarelease"
          prerelease: true
          title: "Beta Build"
          files: |
            ${{ env.FILE_BASENAME }}.zip
            ${{ env.FILE_BASENAME }}.msi
            checksums.txt
            version.txt
            ChangeLog.txt

      - uses: marvinpinto/action-automatic-releases@v1.2.1
        if: ${{ env.IS_STABLE == 'true' }}
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          prerelease: false
          title: "${{ github.ref_name }}"
          files: |
            ${{ env.FILE_BASENAME }}.zip
            ${{ env.FILE_BASENAME }}.msi
            checksums.txt
            version.txt
            ChangeLog.txt

  buildDebug:
    name: Build Debug
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 10

      - name: Cache multiple paths
        uses: actions/cache@v4
        with:
          path: |
            **/obj/**
          key: ${{ runner.os }}-buildDebug

      - name: Build
        shell: pwsh
        run: |
          $msbuildPath = Split-Path (& "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find MSBuild\Current\Bin\amd64\MSBuild.exe | Select-Object -First 1) -Parent
          $env:PATH = $msbuildPath + ';' + $env:PATH
          nuget locals all -clear
          msbuild -v:m -restore -t:Build -p:Configuration=Debug MissionPlanner.sln

      - name: Cleanup
        shell: pwsh
        run: |
          cd bin\Debug\net461
          gci plugins | ForEach-Object {                 if (Test-Path $_.Name -PathType Leaf)                {                    Write-Host "Remove" $_.FullName   ;                 Remove-Item $_.FullName                            } else {                    Write-Host $_.Name                }            }
